# Deploy to Cloudflare Workers.
# 1) change `name` if it collides inside your account
# 2) npm install && npx wrangler deploy
# 3) npx wrangler secret put TICKET_KEY   # openssl rand -hex 32
# 4) optional: npx wrangler secret put PANEL_TOKEN   # openssl rand -hex 16 → owner key, no daily cap

name = "vps-deploy-panel"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# "1" = anyone can use it, limited per IP per day. "0" = token required (private).
PUBLIC_MODE = "1"
# Runs per IP per day (UTC+8 midnight reset) and a whole-worker safety cap per day.
DAILY_LIMIT = "5"
GLOBAL_DAILY = "300"
# Optional human check. Set the sitekey here and: npx wrangler secret put TURNSTILE_SECRET
# TURNSTILE_SITEKEY = ""

# Where the scripts come from. Defaults to this repo's raw files; point these at your
# own mirror if GitHub is slow where your users are.
# SCRIPT_BASE = "https://cdn.example.com/one-click"
# SETUP_URL = "https://example.com/download/setup.sh"
# NEXUS_URL = "https://example.com/download/nexus.sh"
# HY2_URL = "https://example.com/bundle/hy2.sh"

[[ratelimits]]
name = "RL_API"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "RL_START"
namespace_id = "2002"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "RL_AUTH"
namespace_id = "2003"
  [ratelimits.simple]
  limit = 10
  period = 60

# Daily quota counters (strongly consistent, one Durable Object namespace).
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Optional: serve it on your own domain instead of *.workers.dev.
# The zone must be in the same Cloudflare account.
# workers_dev = false
# routes = [
#   { pattern = "panel.example.com", custom_domain = true }
# ]
